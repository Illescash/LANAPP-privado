<svg width="200" height="300" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient for Bastos (Dark Green) -->
    <linearGradient id="bgGradBasto" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05140a"/>
      <stop offset="50%" stop-color="#0a2b12"/>
      <stop offset="100%" stop-color="#021005"/>
    </linearGradient>

    <!-- Glowing Effects -->
    <filter id="neonGlowGreen">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="neonGlowLime">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Circuit Pattern for Background -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 0 20 L 10 20 L 15 15 L 25 15 L 30 20 L 40 20 M 20 0 L 20 10 L 25 15 M 15 15 L 20 25 L 20 40" fill="none" stroke="#ccff00" stroke-width="0.5" stroke-opacity="0.15"/>
      <circle cx="10" cy="20" r="1" fill="#ccff00" fill-opacity="0.3"/>
      <circle cx="30" cy="20" r="1" fill="#ccff00" fill-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Card Body -->
  <rect width="200" height="300" fill="url(#bgGradBasto)" rx="12" stroke="#444" stroke-width="1"/>
  <rect width="194" height="294" x="3" y="3" fill="url(#circuit)" rx="10"/>

  <!-- Cyberpunk Borders Bastos -->
  <path d="M 12 12 L 40 12 M 160 12 L 188 12 M 188 12 L 188 40 M 188 260 L 188 288 M 188 288 L 160 288 M 40 288 L 12 288 M 12 288 L 12 260 M 12 40 L 12 12" fill="none" stroke="#ccff00" stroke-width="3" filter="url(#neonGlowLime)"/>
  <path d="M 60 12 L 140 12 M 60 288 L 140 288 M 188 80 L 188 220 M 12 80 L 12 220" fill="none" stroke="#00ff00" stroke-width="1.5" stroke-dasharray="8,4" opacity="0.8"/>

  <!-- Top-left Number -->
  <text x="22" y="44" font-family="'Courier New', monospace" font-weight="900" font-size="28" fill="#fff" filter="url(#neonGlowLime)">1</text>
  <text x="22" y="44" font-family="'Courier New', monospace" font-weight="900" font-size="28" fill="#ccff00">1</text>

  <!-- Bottom-right Number -->
  <g transform="translate(178, 256) rotate(180)">
    <text x="0" y="0" font-family="'Courier New', monospace" font-weight="900" font-size="28" fill="#fff" filter="url(#neonGlowLime)">1</text>
    <text x="0" y="0" font-family="'Courier New', monospace" font-weight="900" font-size="28" fill="#ccff00">1</text>
  </g>

  <!-- AS DE BASTOS Central Graphic -->
  <g id="cyberBasto" transform="translate(100, 150)">
    
    <!-- Heavy Energy Field (Hexagon grid/Pulse behind baton) -->
    <rect x="-30" y="-85" width="60" height="170" fill="none" stroke="#00ff00" stroke-width="1" stroke-dasharray="2,6" filter="url(#neonGlowGreen)">
      <animate attributeName="stroke-dashoffset" from="16" to="0" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- Handle Grip -->
    <rect x="-12" y="30" width="24" height="60" rx="4" fill="#111" stroke="#00ff00" stroke-width="1.5"/>
    <path d="M -12,45 L 12,35 M -12,60 L 12,50 M -12,75 L 12,65" fill="none" stroke="#333" stroke-width="2"/>
    
    <!-- Pommel -->
    <polygon points="-18,90 18,90 12,105 -12,105" fill="#1a2b1a" stroke="#00ff00" stroke-width="2" filter="url(#neonGlowGreen)"/>

    <!-- Handle Guard -->
    <rect x="-25" y="20" width="50" height="10" rx="3" fill="#152015" stroke="#ccff00" stroke-width="2" filter="url(#neonGlowLime)"/>

    <!-- Main Shaft / Baton Head -->
    <path d="M -18,-70 L 18,-70 L 14,20 L -14,20 Z" fill="#0d1a0d" stroke="#00ff00" stroke-width="2"/>
    
    <!-- EMP Coil Sections -->
    <rect x="-22" y="-50" width="44" height="12" fill="#0a200a" stroke="#ccff00" stroke-width="2" filter="url(#neonGlowLime)"/>
    <rect x="-22" y="-20" width="44" height="12" fill="#0a200a" stroke="#ccff00" stroke-width="2" filter="url(#neonGlowLime)"/>
    <rect x="-22" y="10" width="44" height="12" fill="#0a200a" stroke="#ccff00" stroke-width="2" filter="url(#neonGlowLime)"/>

    <!-- Coil Wires/Energy flowing vertically -->
    <line x1="-8" y1="-70" x2="-8" y2="20" stroke="#00ff00" stroke-width="2" filter="url(#neonGlowGreen)"/>
    <line x1="8" y1="-70" x2="8" y2="20" stroke="#00ff00" stroke-width="2" filter="url(#neonGlowGreen)"/>
    
    <!-- Central Power Core Line -->
    <line x1="0" y1="-65" x2="0" y2="15" stroke="#fff" stroke-width="3" filter="drop-shadow(0 0 4px #00ff00)"/>

    <!-- Top Cap / Energy Emitter -->
    <polygon points="-22,-70 22,-70 12,-90 -12,-90" fill="#111" stroke="#ccff00" stroke-width="2" filter="url(#neonGlowLime)"/>
    <circle cx="0" cy="-90" r="6" fill="#ccff00" filter="drop-shadow(0 0 6px #ccff00)">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Holographic overlay text -->
  <text x="100" y="280" font-family="'Courier New', monospace" font-size="8" fill="#ccff00" text-anchor="middle" letter-spacing="4" opacity="0.6">Peer2Play</text>
</svg>
